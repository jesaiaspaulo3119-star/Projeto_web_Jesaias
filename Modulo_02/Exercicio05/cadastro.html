<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercadinho Seu Zé - Cadastrar Produto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🛒 Mercadinho Seu Zé - Sistema ERP</h1>
  </header>

  <nav>
    <a href="index.html">Início</a>
    <a href="produtos.html">Estoque de Produtos</a>
    <a href="cadastro.html">Cadastrar Produto</a>
  </nav>

  <main class="conteudo">
    <h2>➕ Cadastro de Mercadorias</h2>

    <form action="produtos.html" method="get">
      
      <!-- SEÇÃO 1: INFORMAÇÕES BÁSICAS -->
      <fieldset>
        <legend>Dados do Produto</legend>

        <div class="campo">
          <label for="nome">Nome do Produto:</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Café Torrado 500g" required>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="categoria">Categoria:</label>
            <select id="categoria" name="categoria" required>
              <option value="">Selecione...</option>
              <option value="alimentos">Alimentos</option>
              <option value="bebidas">Bebidas</option>
              <option value="laticinios">Laticínios</option>
              <option value="limpeza">Limpeza</option>
            </select>
          </div>

          <div class="campo">
            <label for="unidade">Unidade de Medida:</label>
            <select id="unidade" name="unidade">
              <option value="un">Unidade (UN)</option>
              <option value="kg">Quilo (KG)</option>
              <option value="lt">Litro (LT)</option>
              <option value="pct">Pacote (PCT)</option>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- SEÇÃO 2: VALORES E VALIDADE -->
      <fieldset>
        <legend>Preço e Validade</legend>

        <div class="linha-dupla">
          <div class="campo">
            <label for="preco">Preço Unitário (R$):</label>
            <input type="number" id="preco" name="preco" step="0.01" placeholder="0.00" required>
          </div>

          <div class="campo">
            <label for="qtd">Quantidade em Estoque:</label>
            <input type="number" id="qtd" name="qtd" placeholder="0" required>
          </div>
        </div>

        <div class="campo">
          <label for="validade">Data de Validade:</label>
          <input type="date" id="validade" name="validade" required>
        </div>
      </fieldset>

      <button type="submit">Salvar Produto no Sistema</button>
    </form>
  </main>

</body>
</html>
