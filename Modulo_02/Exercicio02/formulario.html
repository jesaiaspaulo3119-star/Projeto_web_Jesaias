<!DOCTYPE html>
<html lang="pt-br">
 <head>   
<meta charset="UTF-8">
<meta name="viewport"
    content="width=device-width, initial-scale=1.0">
<title>Formulario</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
    }
    .formulario {
        width: 400px;
        margin: 50px auto;
        background-color: white;
        padding: 25px;
        border-radius: 10px;
    }

    h1 {
        text-align:center
    }
    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
    }
    input select,textarea {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }
    button {

        width: 100%;
        margin-top: 20px;
        padding: 12px;
        background-color: #333;
        color: white;
        border: none;
        cursor: pointer;
    }
    button:hover {
        background-color: #555;
    }
</style>
</head>

<body>

    <div class="formulario">

    <h1> Cadastro</h1>

    <form>
    <label for="nome">Nome:</label>
    <input
        type="text"
        id="nome"
        placeholder="Digite seu nome">
    
    <label for="cidade">Cidade:</label>
    
    <input
        type="tex"
        placeholder="Digite sua Cidade">

    <label for="telefone">Telefone:</label>

    <input
        type="tel"
        placeholder="Digite seu Telefone">   

    <label for="email">E-mail:</label>
    <input
        type="email"
        id="email"
        placeholder="Digite seu email">

    <label for="idade">Idade:</label>
    <input
        type="number"
        id="idade"
        placeholder="Digite sua idade">

    <label for="sexo">
        Sexo:
    </label>

    <input
        type="radio"
        name= "sexo"
        value= "masculilo">Masculino

    <input
        type="radio"
        name="sexo"
        value="feminino">Feminino

    <input
        type="radio"
        name="sexo"
        value="Outros"> Outros

    <label for="curso">Curso:</label>

    <select id="curso">
    <option value="">
        Selecione
    </option>

    <option value="tds">
        Desevolvimento de Sistemas
    </option>

    <option value="adm">
        Administração
    </option>

    <option value="enfermagem">
        Enfermagem
    </option>

    <option value="log">
        Logística
    </option>

    </select>
    <label for="mensagem">
        Obsevação:
    </label>

    <textarea
        id="mensagem"
        rows="4"
        placeholder="Digite uma observação"></textarea>
    <button type="submit">
        Cadastrar
    </button>
    </form>
</div>
</body>
</html>
